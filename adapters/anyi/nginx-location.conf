# Include inside the API's actively loaded Nginx server block.
# Point proxy_pass at your queue API. The API must authenticate every worker
# request and enforce the 240 MB ZIP / 32 MB runtime-file limits itself.
location /internal/live2d/ {
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
